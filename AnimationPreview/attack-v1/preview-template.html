<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>霜誓者 · 攻击动作</title>
<style>*{box-sizing:border-box}body{margin:0;color:#e3ebff;background:#101727;font:14px system-ui,"Microsoft YaHei",sans-serif}main{height:100vh;display:flex;flex-direction:column}header{padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#151f31;border-bottom:1px solid #34415c}b{margin-right:auto;font-weight:500}button,select{border:1px solid #435577;border-radius:6px;padding:8px 13px;background:#253650;color:#e3ebff;cursor:pointer;font:inherit}button.active{background:#4568a5;border-color:#93bafa}#stage{position:relative;flex:1;min-height:0;background:radial-gradient(ellipse at 35% 65%,#243454,#101727 75%)}canvas{position:absolute;inset:0;width:100%;height:100%}#fx{pointer-events:none}footer{padding:9px 18px;display:flex;align-items:center;gap:12px;border-top:1px solid #34415c;background:#151f31}input{flex:1;min-width:60px;accent-color:#91b6fc}#status{min-width:140px;color:#9db5dc;font-size:12px}#phase{position:absolute;left:18px;top:14px;color:#a7c1e9;font-size:12px}#hint{position:absolute;left:18px;bottom:14px;color:#7790b5;font-size:11px}@media(max-width:600px){header{gap:6px;padding:10px}b{width:100%}button,select{padding:7px 9px;font-size:12px}footer{padding:8px;gap:7px}#status{min-width:100px}}</style>
<main><header><b>霜誓者 · attack</b><button id="magic" class="active">魔法阵施法</button><button id="melee">挥杖敲击</button><button id="replay">重播</button><button id="pause">暂停</button><select id="speed" aria-label="速度"><option value="1">正常速度</option><option value=".5">半速检查</option></select><button id="export">导出动图</button></header><section id="stage"><canvas id="view"></canvas><canvas id="fx"></canvas><div id="phase">载入…</div><div id="hint">独立部件 · 关节转动 · 不拉伸纹样</div></section><footer><input id="scrub" aria-label="动画时间" type="range" min="0" max="2.75" step=".01" value="0"><span id="status">载入素材…</span></footer></main>
<script>/*RUNTIME*/</script><script>
const gifenc=(()=>{const module={exports:{}};const exports=module.exports;/*GIFENC*/return module.exports;})();
const DATA=/*DATA*/;
const canvas=document.querySelector('#view'),fx=document.querySelector('#fx'),ctx=fx.getContext('2d');
const gl=canvas.getContext('webgl',{alpha:true,premultipliedAlpha:false,antialias:true,preserveDrawingBuffer:true});
let renderer,skeleton,state,data,mode='attack_magic',clock=0,playing=true,exporting=false,last=performance.now(),target,release,targets,trail=[];
const status=document.querySelector('#status'),phase=document.querySelector('#phase');
const durations={attack_magic:2.1,attack_melee:1.85};
function viewport(){const height=Math.max(1450,2200*canvas.height/canvas.width);renderer.camera.position.set(300,570,0);renderer.camera.viewportHeight=height;renderer.camera.viewportWidth=height*canvas.width/canvas.height;renderer.camera.update();gl.viewport(0,0,canvas.width,canvas.height);}
function resize(){const d=Math.min(devicePixelRatio,2);canvas.width=fx.width=Math.round(canvas.clientWidth*d);canvas.height=fx.height=Math.round(canvas.clientHeight*d);viewport();}
function screen(p){return {x:(p.x-renderer.camera.position.x)/renderer.camera.viewportWidth*canvas.width+canvas.width/2,y:canvas.height/2-(p.y-renderer.camera.position.y)/renderer.camera.viewportHeight*canvas.height};}
function tipOf(model,name=mode){const melee=name==='attack_melee',tip=melee?DATA.meleeTip:DATA.staffTip;return model.findBone(melee?'melee_staff':'staff').localToWorld(new spine.Vector2(tip[0],tip[1]));}
function sampleTip(name,t){const ghost=new spine.Skeleton(data),gs=new spine.AnimationState(new spine.AnimationStateData(data));gs.setAnimation(0,name,false).trackTime=t;gs.apply(ghost);ghost.updateWorldTransform(spine.Physics.none);return tipOf(ghost,name);}
function pose(t){skeleton.setToSetupPose();const duration=durations[mode],clip=t>duration?(mode==='attack_melee'?'idle_melee':'idle_loop'):mode;if(state.getCurrent(0).animation.name!==clip)state.setAnimation(0,clip,true);state.getCurrent(0).trackTime=t>duration?t-duration:t;state.apply(skeleton);skeleton.updateWorldTransform(spine.Physics.none);}
function clamp(x){return Math.min(1,Math.max(0,x));}
function burst(point,t,color,amount=14){if(t<0||t>.38)return;const a=1-t/.38,p=screen(point),scale=canvas.width/renderer.camera.viewportWidth;ctx.save();ctx.translate(p.x,p.y);ctx.scale(scale,scale);ctx.globalAlpha=a;ctx.strokeStyle=color;ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=14;for(let i=0;i<amount;i++){const angle=i*Math.PI*2/amount+.15;const r=22+t*(280+(i%3)*90);ctx.save();ctx.rotate(angle);ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(r+16,5);ctx.lineTo(r+30,0);ctx.lineTo(r+16,-5);ctx.closePath();ctx.fill();ctx.restore();}ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,22+t*140,0,Math.PI*2);ctx.stroke();ctx.restore();}
function plate(t){const p=screen(target),scale=canvas.width/renderer.camera.viewportWidth;const hit=mode==='attack_magic'?1.17:.75;const q=clamp(1-(t-hit)/.25)*(t>=hit?1:0);ctx.save();ctx.translate(p.x+Math.sin((t-hit)*90)*q*3,p.y);ctx.scale(scale,scale);ctx.strokeStyle=q>0?'#e5f9ff':'#576b87';ctx.fillStyle='#18243a';ctx.lineWidth=6;ctx.globalAlpha=.7+q*.3;ctx.beginPath();ctx.arc(0,0,78,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.strokeStyle=q>0?'#b8eaff':'#304562';ctx.lineWidth=3;for(const r of [47,20]){ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();}ctx.restore();}
function circle(point,t,alpha,size){const p=screen(point),scale=canvas.width/renderer.camera.viewportWidth;ctx.save();ctx.translate(p.x,p.y);ctx.scale(scale*size,scale*size);ctx.globalAlpha=alpha;ctx.shadowColor='#50cfff';ctx.shadowBlur=20;ctx.strokeStyle='#9ceaff';ctx.fillStyle='#e9fcff';ctx.lineWidth=4;ctx.scale(.42,1);for(const r of [145,129,100]){ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();}ctx.rotate(t*1.3);ctx.lineWidth=3;for(let i=0;i<12;i++){ctx.save();ctx.rotate(i*Math.PI/6);ctx.beginPath();ctx.moveTo(109,-6);ctx.lineTo(121,0);ctx.lineTo(110,7);ctx.moveTo(113,-12);ctx.lineTo(113,12);ctx.stroke();ctx.restore();}ctx.beginPath();for(let i=0;i<7;i++){const a=i*Math.PI*2/3;const x=Math.cos(a)*89,y=Math.sin(a)*89;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();ctx.rotate(-t*2.6);ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI*2/5;const x=Math.cos(a)*71,y=Math.sin(a)*71;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();ctx.restore();}
function magicFx(t){
 const build=clamp((t-.42)/.43),fade=1-clamp((t-1.28)/.28);if(t<.42||t>1.56)return;
 const live=t<1.05?tipOf(skeleton):release;const gate={x:live.x+65,y:live.y};circle(gate,t,build*fade,.65+.35*build);
 const p=screen(live),scale=canvas.width/renderer.camera.viewportWidth;ctx.save();ctx.globalAlpha=build*fade;ctx.fillStyle='#c7f5ff';ctx.shadowColor='#48cfff';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(p.x,p.y,(10+Math.sin(t*20)*2)*scale,0,Math.PI*2);ctx.fill();for(let i=0;i<9;i++){const a=t*5+i*.698,r=(22+7*Math.sin(i+t*8))*scale;ctx.beginPath();ctx.arc(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r,2*scale,0,Math.PI*2);ctx.fill();}ctx.restore();
 if(t>=1.05&&t<1.3){const u=clamp((t-1.05)/.12),from=screen(gate),to=screen({x:gate.x+(target.x-gate.x)*u,y:gate.y+(target.y-gate.y)*u});const opacity=1-clamp((t-1.16)/.14);ctx.save();ctx.globalAlpha=opacity;ctx.lineCap='round';ctx.strokeStyle='#4cceff';ctx.shadowColor='#36b8ff';ctx.shadowBlur=25;ctx.lineWidth=28*scale;ctx.beginPath();ctx.moveTo(from.x,from.y);ctx.lineTo(to.x,to.y);ctx.stroke();ctx.strokeStyle='#eaffff';ctx.lineWidth=9*scale;ctx.stroke();ctx.fillStyle='#ddfaff';ctx.beginPath();ctx.moveTo(to.x+27*scale,to.y);ctx.lineTo(to.x-19*scale,to.y+11*scale);ctx.lineTo(to.x-29*scale,to.y);ctx.lineTo(to.x-19*scale,to.y-11*scale);ctx.closePath();ctx.fill();ctx.restore();}
 burst(target,t-1.17,'#b7efff',18);
}
function physicalFx(t){if(t>.56&&t<.92){const scale=canvas.width/renderer.camera.viewportWidth;ctx.save();ctx.strokeStyle='#e4e1cb';ctx.lineWidth=35*scale;ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha=.17*(1-clamp((t-.8)/.12));ctx.beginPath();let first=true;for(const q of trail){if(q.t>t||q.t<t-.16)continue;const p=screen(q.p);if(first){ctx.moveTo(p.x,p.y);first=false;}else ctx.lineTo(p.x,p.y);}ctx.stroke();ctx.lineWidth=7*scale;ctx.globalAlpha=.4;ctx.stroke();ctx.restore();}burst(target,t-.75,'#fff1cf',10);}
function effects(t){ctx.clearRect(0,0,fx.width,fx.height);plate(t);if(mode==='attack_magic')magicFx(t);else physicalFx(t);}
function paint(t){pose(t);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);renderer.begin();renderer.drawSkeleton(skeleton,false);renderer.end();effects(t);document.querySelector('#scrub').value=t;const name=mode==='attack_magic'?'法杖施法':'物理挥杖';phase.textContent=name+' · '+(t>durations[mode]?'回到待机':mode==='attack_magic'?(t<.42?'抬杖蓄能':t<1.05?'展开魔法阵':t<1.3?'释放冰系法术':'后坐与收势'):(t<.52?'蓄力抬杖':t<.74?'加速挥击':t<.94?'命中与随势':'收杖回位'));status.textContent=t.toFixed(2)+' / '+(durations[mode]+.65).toFixed(2)+' 秒';}
function choose(name){mode=name;target=targets[name];clock=0;playing=true;state.setAnimation(0,name,false);document.querySelector('#scrub').max=durations[name]+.65;document.querySelector('#magic').classList.toggle('active',name==='attack_magic');document.querySelector('#melee').classList.toggle('active',name==='attack_melee');document.querySelector('#pause').textContent='暂停';}
document.querySelector('#magic').onclick=()=>choose('attack_magic');document.querySelector('#melee').onclick=()=>choose('attack_melee');document.querySelector('#replay').onclick=()=>choose(mode);document.querySelector('#pause').onclick=()=>{playing=!playing;document.querySelector('#pause').textContent=playing?'暂停':'播放'};document.querySelector('#scrub').oninput=e=>{clock=Number(e.target.value);playing=false;document.querySelector('#pause').textContent='播放';paint(clock);};
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!exporting){if(playing)clock=(clock+dt*Number(document.querySelector('#speed').value))%(durations[mode]+.65);paint(clock);}requestAnimationFrame(frame);}
async function boot(){if(!gl)throw Error('需要 WebGL');renderer=new spine.SceneRenderer(canvas,gl,true);const atlas=new spine.TextureAtlas(DATA.atlas);for(const page of atlas.pages){const img=new Image();img.src=DATA.images[page.name];await img.decode();page.setTexture(new spine.GLTexture(gl,img,false));}data=new spine.SkeletonJson(new spine.AtlasAttachmentLoader(atlas)).readSkeletonData(DATA.skeleton);skeleton=new spine.Skeleton(data);state=new spine.AnimationState(new spine.AnimationStateData(data));const meleePoint=sampleTip('attack_melee',.75);release=sampleTip('attack_magic',1.05);targets={attack_melee:meleePoint,attack_magic:{x:release.x+420,y:release.y}};for(let i=0;i<121;i++){const t=i/120*1.85;trail.push({t,p:sampleTip('attack_melee',t)});}choose(mode);resize();window.addEventListener('resize',resize);window.attackPreview={data,target,release};requestAnimationFrame(frame);}
document.querySelector('#export').onclick=async()=>{
 if(exporting)return;exporting=true;const wasPlaying=playing,button=document.querySelector('#export');button.disabled=true;const lockedControls=[...document.querySelectorAll('button,select,input')];lockedControls.forEach(e=>e.disabled=true);
 const out=document.createElement('canvas');out.width=800;out.height=520;
 const composite=out.getContext('2d',{willReadFrequently:true}),gif=gifenc.GIFEncoder(),frames=Math.ceil((durations[mode]+.65)*25);
 function pixels(t){paint(t);composite.fillStyle='#111a2b';composite.fillRect(0,0,800,520);composite.drawImage(canvas,0,0);composite.drawImage(fx,0,0);return composite.getImageData(0,0,800,520).data;}
 try{
  canvas.width=fx.width=800;canvas.height=fx.height=520;viewport();
  const first=pixels(0),peak=pixels(mode==='attack_magic'?1.13:.76),samples=new Uint8Array(first.length+peak.length);samples.set(first);samples.set(peak,first.length);
  const palette=gifenc.quantize(samples,256,{format:'rgb565'});
  for(let i=0;i<frames;i++){
   gif.writeFrame(gifenc.applyPalette(pixels(i/25),palette,'rgb565'),800,520,{palette,delay:40,repeat:0});
   if(i%12===0){status.textContent='导出 '+Math.round(i/frames*100)+'%';await new Promise(r=>setTimeout(r,0));}
  }
  gif.finish();const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([gif.bytes()],{type:'image/gif'}));link.download=mode+'.gif';link.click();
 }catch(e){status.textContent=e.message;console.error(e)}finally{exporting=false;lockedControls.forEach(e=>e.disabled=false);playing=wasPlaying;resize();}
};
boot().catch(e=>{status.textContent='载入失败：'+e.message;console.error(e)});
</script></html>
