<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>霜誓者 · 待机动画演示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1320;color:#e9effc;font:15px system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}main{height:100vh;display:grid;grid-template-columns:1fr 275px}#stage{position:relative;min-width:0;background:radial-gradient(ellipse at 55% 44%,#263455,#111b30 66%,#0b1220)}canvas{width:100%;height:100%;display:block}aside{border-left:1px solid #2b3750;padding:30px 24px;background:#121c2d}h1{font-size:24px;margin:12px 0 5px;font-weight:600}p{color:#a8bad9;line-height:1.7}.tag{color:#8dcff8;font-size:12px;letter-spacing:2px}button,select{width:100%;border:1px solid #425273;background:#223450;color:#edf5ff;padding:11px;border-radius:9px;margin:6px 0;font:inherit;cursor:pointer}button:hover{background:#2e4567}label{display:block;margin:20px 0 8px;color:#c2d4f3}input[type=range]{width:100%;accent-color:#83b8fa}.small{font-size:12px}.badge{position:absolute;left:24px;top:22px;font-size:12px;color:#b6cce7;background:#0b1429b0;padding:9px 13px;border:1px solid #34465d;border-radius:20px}#status{color:#8dcff8}.check{display:flex;align-items:center;gap:8px;margin:10px 0}#foot{position:absolute;bottom:20px;left:24px;color:#8298b8;font-size:12px}@media(max-width:700px){main{grid-template-columns:1fr}aside{position:absolute;right:12px;bottom:12px;padding:12px;width:190px;border:1px solid #425273;border-radius:12px;background:#121c2deb}aside h1,aside p,aside .tag,aside .small{display:none}label{margin:7px 0}}
@media(max-width:700px){main{grid-template-rows:minmax(0,1fr) 150px}aside{position:static;width:auto;height:150px;padding:10px 14px;border-radius:0;display:flex;flex-wrap:wrap;align-content:center;gap:7px}aside>label,aside>#scrub,aside>#backdrop{display:none}aside>button{width:calc(50% - 4px);margin:0;font-size:13px;padding:9px}aside>#speed{width:calc(50% - 4px);margin:0;padding:7px;font-size:13px}#status{width:calc(50% - 4px);font-size:12px;align-self:center}.badge{top:10px;left:12px}#foot{bottom:8px;left:12px;font-size:10px}}
main{grid-template-rows:minmax(0,1fr)}#stage{min-height:0}aside{min-height:0;overflow-y:auto;padding-top:20px;padding-bottom:20px}
@media(max-width:700px){main{grid-template-rows:minmax(0,1fr) 150px}}
</style>
<main><section id="stage"><canvas id="view"></canvas><div class="badge">idle_loop · 6 秒循环</div><div id="foot">骨骼驱动 · 脚底固定 · 可暂停查看</div></section><aside><div class="tag">FROSTSWORN / MOTION STUDY</div><h1>霜誓者</h1><p>待机动画 · 第一版<br>呼吸、眨眼、发梢与衣摆跟随。</p><button id="play">暂停动画</button><button id="pose">查看原始站姿</button><label for="speed">播放速度</label><select id="speed"><option value=".5">0.5 × 慢放</option><option value="1" selected>1 × 正常</option><option value="1.5">1.5 ×</option></select><label for="scrub">时间 <span id="time">0.00</span> / 6.00 秒</label><input id="scrub" type="range" min="0" max="6" step=".01" value="0"><label class="check"><input id="bones" type="checkbox"> 显示骨骼</label><label class="check"><input id="wire" type="checkbox"> 显示变形网格</label><label for="backdrop">背景</label><select id="backdrop"><option value="dark">深色</option><option value="light">浅色</option><option value="checker">透明棋盘格</option></select><p class="small">当前演示包含 idle_loop。攻击、施法、受伤和死亡动作尚未制作。</p><div id="status">载入图像…</div></aside></main>
<script>/*RUNTIME*/</script><script>
const gifenc=(()=>{const module={exports:{}};const exports=module.exports;/*GIFENC*/return module.exports;})();
const DATA=/*DATA*/;
const canvas=document.querySelector('#view');
const gl=canvas.getContext('webgl',{alpha:true,premultipliedAlpha:false,antialias:true,preserveDrawingBuffer:true});
let renderer, skeleton, state, playing=true, clock=0, last=performance.now(), setup=false, exporting=false;
const report=document.querySelector('#status');
function resize(){const d=Math.min(devicePixelRatio,2);canvas.width=Math.round(canvas.clientWidth*d);canvas.height=Math.round(canvas.clientHeight*d);renderer.camera.position.set(0,588,0);const height=Math.max(1390,1390*canvas.height/canvas.width);renderer.camera.viewportHeight=height;renderer.camera.viewportWidth=height*canvas.width/canvas.height;renderer.camera.update();gl.viewport(0,0,canvas.width,canvas.height);}
function poseAt(t){skeleton.setToSetupPose();if(!setup){state.getCurrent(0).trackTime=t;state.apply(skeleton);}skeleton.updateWorldTransform(spine.Physics.update);}
function paint(t){poseAt(t);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);renderer.begin();renderer.drawSkeleton(skeleton,false);const debug=renderer.skeletonDebugRenderer;debug.drawBones=document.querySelector('#bones').checked;debug.drawMeshTriangles=document.querySelector('#wire').checked;debug.drawRegionAttachments=false;debug.drawMeshHull=false;debug.drawBoundingBoxes=false;debug.drawPaths=false;if(debug.drawBones||debug.drawMeshTriangles)renderer.drawSkeletonDebug(skeleton,false);renderer.end();document.querySelector('#time').textContent=t.toFixed(2);document.querySelector('#scrub').value=t;}
async function boot(){if(!gl)throw Error('当前浏览器没有可用的 WebGL');renderer=new spine.SceneRenderer(canvas,gl,true);const atlas=new spine.TextureAtlas(DATA.atlas);for(const page of atlas.pages){const image=new Image();image.src=DATA.images[page.name];await image.decode();page.setTexture(new spine.GLTexture(gl,image,false));}const loader=new spine.AtlasAttachmentLoader(atlas);const reader=new spine.SkeletonJson(loader);const data=reader.readSkeletonData(DATA.skeleton);skeleton=new spine.Skeleton(data);state=new spine.AnimationState(new spine.AnimationStateData(data));state.setAnimation(0,'idle_loop',true);resize();window.addEventListener('resize',resize);report.textContent='正在播放 · Spine 4.2';window.preview={skeleton,state,data,renderAt(t){setup=false;clock=t;playing=false;paint(t)},resume(){playing=true},get loopDuration(){return data.animations[0].duration}};window.__ready=true;requestAnimationFrame(frame);}
function frame(now){const dt=Math.min((now-last)/1000,.06);last=now;if(!exporting){if(playing&&!setup)clock=(clock+dt*Number(document.querySelector('#speed').value))%6;paint(clock);}requestAnimationFrame(frame);}
document.querySelector('#play').onclick=()=>{playing=!playing;setup=false;document.querySelector('#play').textContent=playing?'暂停动画':'播放动画';document.querySelector('#pose').textContent='查看原始站姿';};
document.querySelector('#pose').onclick=()=>{setup=!setup;document.querySelector('#pose').textContent=setup?'返回待机动画':'查看原始站姿';};
document.querySelector('#scrub').oninput=e=>{playing=false;setup=false;clock=Number(e.target.value);document.querySelector('#play').textContent='播放动画';};
document.querySelector('#backdrop').onchange=e=>{const stage=document.querySelector('#stage');stage.style.background=e.target.value==='light'?'radial-gradient(ellipse,#e6eaf4,#c5d2e5)':e.target.value==='checker'?'repeating-conic-gradient(#283345 0% 25%,#354257 0% 50%) 0/28px 28px':'';};
const exportButton=document.createElement('button');exportButton.textContent='导出待机动图';exportButton.id='export';document.querySelector('aside').append(exportButton);
exportButton.onclick=async()=>{if(exporting)return;exporting=true;exportButton.disabled=true;const wasPlaying=playing;const wasSetup=setup;setup=false;const out=document.createElement('canvas');out.width=out.height=480;const ctx=out.getContext('2d',{willReadFrequently:true});const gif=gifenc.GIFEncoder();let palette;try{canvas.width=canvas.height=480;gl.viewport(0,0,480,480);renderer.camera.viewportWidth=renderer.camera.viewportHeight=1390;renderer.camera.update();for(let i=0;i<120;i++){poseAt(i/20);gl.clearColor(.06,.09,.15,1);gl.clear(gl.COLOR_BUFFER_BIT);renderer.begin();renderer.drawSkeleton(skeleton,false);renderer.end();ctx.drawImage(canvas,0,0);const rgba=ctx.getImageData(0,0,480,480).data;if(!palette)palette=gifenc.quantize(rgba,256,{format:'rgb565'});const indexed=gifenc.applyPalette(rgba,palette,'rgb565');gif.writeFrame(indexed,480,480,{palette,delay:50,repeat:0});if(i%15===0){report.textContent='导出动图 '+Math.round(i/120*100)+'%';await new Promise(r=>setTimeout(r,0));}}gif.finish();const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([gif.bytes()],{type:'image/gif'}));link.download='frostsworn-idle-loop.gif';link.click();report.textContent='动图已导出 · 6 秒循环';}catch(e){report.textContent='导出失败：'+e.message;console.error(e)}finally{exporting=false;exportButton.disabled=false;playing=wasPlaying;setup=wasSetup;resize();}};
boot().catch(e=>{report.textContent='载入失败：'+e.message;console.error(e);window.__error=e.message});
</script></html>
