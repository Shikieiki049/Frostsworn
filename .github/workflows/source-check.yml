name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate definitions and version
        run: python tools/validate_source.py
      - name: Verify generated sources
        run: |
          python tools/version_info.py
          python tools/expansion_content.py
          git diff --exit-code -- Source/VersionInfo.Generated.cs Source/ExpansionCards.cs
